<style>
  html, body { margin: 0; height: 100%; overflow: hidden;
         /* background gradient: current blue at the top, lighter cyan blue at the bottom */

  #viewBtn:disabled { opacity: .4; cursor: not-allowed; filter: grayscale(.6); }
  #viewBtn:disabled:hover { background: rgba(14, 26, 48, .78); }
  #customMenu { width: 250px; max-height: calc(100vh - 24px); overflow-y: auto; box-sizing: border-box; }
  #customMenu[hidden] { display: none; }
  #customMenu .menuHead { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; }
  #customMenu .menuHead button { border: 0; background: none; color: inherit; font-size: 20px; line-height: 1; cursor: pointer; opacity: .7; padding: 0 2px; }
  #customMenu .menuHead button:hover { opacity: 1; }

  .preset { display: block; width: 100%; text-align: left; margin-top: 8px; padding: 8px 10px; border: 2px solid transparent; border-radius: 8px;
            background: #1a2d4f; color: inherit; font: inherit; cursor: pointer; }
  .preset:hover { background: #21386290; }
  .preset.active { border-color: #7fb0ff; background: #223a66; }
  .preset b { display: block; margin-bottom: 7px; }
  .toggle { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: #1a2d4f; cursor: pointer; }
  .toggle input { width: 16px; height: 16px; margin: 0; accent-color: #7fb0ff; cursor: pointer; }
  .swatches { display: flex; gap: 3px; }
  .swatches i { flex: 1; height: 12px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .4); }
  #viewBtn { position: fixed; top: 12px; right: 12px; padding: 9px 16px; border: 0; border-radius: 8px; background: rgba(14, 26, 48, .78); backdrop-filter: blur(6px);
             color: #e8eef8; font-size: 13px; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  #viewBtn:hover { background: rgba(31, 52, 92, .9); }

  #arrowBtn { position: fixed; bottom: 12px; right: 12px; padding: 9px 16px; border: 0; border-radius: 8px; background: rgba(14, 26, 48, .78); backdrop-filter: blur(6px);
              color: #e8eef8; font-size: 13px; font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 8px; }

  body.ui-hidden #uiLeft, body.ui-hidden #viewBtn, body.ui-hidden #arrowBtn, body.ui-hidden #help, body.ui-hidden #toast, body.ui-hidden #handPanel { display: none; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; font-size: 15px; pointer-events: none; }

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { toCreasedNormals, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------ *
 *  External models: <name>.fbx files located next to this HTML file
 *  (room.fbx, hall.fbx, ele.fbx, t_shape.fbx, cross.fbx).
 * ------------------------------------------------------------------ */
const MODEL_DIR = '';   // '' = same folder as this HTML file; e.g. 'models/' for a sub-folder
const modelBuffers = {};   // type -> ArrayBuffer

/* Room icons (white PNGs next to this HTML file), shown on top of the rooms in BOTH views: standing on the roof and facing the camera in the angled view, lying flat in the top view.
 * room_type -> file. The white start room has no icon. */
const ICON_DIR = '';      // '' = same folder as this HTML file
const ICON_FILES = { green: 'safe_room.png', yellow: 'shop.png', orange: 'sign_puzzle.png', purple: 'teacher.png', red: 'boss.png' };
const ICON_SIZE = 0.58;   // icon width as a fraction of the room's width (the red room is scaled, so its icon scales too)
const BADGE_SIZE = 1.3;   // angled view: diameter of the round badge behind each icon, as a multiple of the icon's size (0 = no badge)
const BADGE_RING = 0.045; // thickness of the badge's dark outline, as a fraction of the icon's size
const ICON_SHADOW = 0.5;  // opacity of the dark drop shadow that keeps the white icon readable on light rooms
const iconUrls = {};      // room_type -> url (filled by default, or by the manual file picker)


/* ------------------------------------------------------------------ *
 *  Piece definitions (measured from the FBX files, world units).
 *  conn: opening centre (x,z) relative to the model origin + outward dir.
 *  rects: footprint boxes [x0,z0,x1,z1] used for collision tests.
 * ------------------------------------------------------------------ */
const DEFS = {
  room:    { room: true, weight: 6,
             conns: [[ 42.3,0,1,0],[-42.3,0,-1,0],[0,42.3,0,1],[0,-42.3,0,-1]],
             rects: [[-42.3,-42.3,42.3,42.3]] },
  hall:    { weight: 5,
             conns: [[0,59.6,0,1],[0,-55.3,0,-1]],
             rects: [[-21,-55.3,21,59.6]] },
  ele:     { weight: 3,
             conns: [[69,14.41,1,0],[-26.74,-56.6,0,-1]],
             rects: [[-45.9,-6.6,69,35.4],[-45.9,-56.6,-7.5,35.4]] },
  t_shape: { weight: 1.8,
             conns: [[-74.5,-13.67,-1,0],[79.4,-13.67,1,0],[1.7,66,0,1]],
             rects: [[-74.5,-37.1,79.4,9.7],[-19.3,9.7,22.7,66]] },
  cross:   { weight: 0.8,
             conns: [[-74.8,1.74,-1,0],[79,1.74,1,0],[1.35,-76.3,0,-1],[1.35,81.4,0,1]],
             rects: [[-74.8,-21.7,79,25.2],[-19.7,-76.3,22.3,81.4]] },
};
const TYPES = Object.keys(DEFS);
const GAP = 7;            // blocks never touch: this much empty space between connected openings
const MARGIN = 2;         // extra clearance for collision tests
const CREASE_ANGLE = Math.PI / 6;   // edges sharper than 30° stay hard
const ROOM_TYPES = ['yellow', 'purple', 'green', 'orange'];   // random rooms in between; white (start) and red (end) are fixed
const MAX_HALL_RUN = 2;   // never more than this many halls connected in a row
const START_CLEAR = 100;  // radius (from the white room's walls) kept free of every piece except the first hall
const TIP_ROOM_CHANCE = 1;   // after the map is done: chance that a free t_shape / cross tip gets a room
const BAND = 330;         // max sideways drift from the main direction

/* ------------------------------------------------------------------ *
 *  Helpers
 * ------------------------------------------------------------------ */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// rotate (x,z) by k quarter turns, matching three.js rotation.y = k*PI/2
function rot(x, z, k) { switch (((k % 4) + 4) % 4) { case 0: return [x, z]; case 1: return [z, -x]; case 2: return [-x, -z]; default: return [-z, x]; } }
function worldRects(def, k, px, pz) {
  return def.rects.map(([x0, z0, x1, z1]) => {
    const a = rot(x0, z0, k), b = rot(x1, z1, k);
    return [Math.min(a[0], b[0]) + px, Math.min(a[1], b[1]) + pz, Math.max(a[0], b[0]) + px, Math.max(a[1], b[1]) + pz];
  });
}
function overlap(a, b, m) { return a[0] < b[2] + m && a[2] > b[0] - m && a[1] < b[3] + m && a[3] > b[1] - m; }
function rectDist(a, b) { return Math.hypot(Math.max(a[0] - b[2], b[0] - a[2], 0), Math.max(a[1] - b[3], b[1] - a[3], 0)); }
function pick(rng, items, w) { let t = rng() * w.reduce((s, v) => s + v, 0); for (let i = 0; i < items.length; i++) { t -= w[i]; if (t <= 0) return items[i]; } return items[items.length - 1]; }

/* ------------------------------------------------------------------ *
 *  Procedural generator
 * ------------------------------------------------------------------ */
function scaleDef(def, f) {
  return { ...def, conns: def.conns.map(([x, z, dx, dz]) => [x * f, z * f, dx, dz]),
                   rects: def.rects.map(r => r.map(v => v * f)) };
}
const END_SCALE = 1.5;                         // the final red room is 1.5x a standard room
const END_DEF = scaleDef(DEFS.room, END_SCALE);
const lerp = (a, b, t) => a + (b - a) * t;

/* seed, count (total pieces incl. start + end room), direction angle, straightening 0..1.
 * The map always starts with a white room and ends with a (1.5x) red room.
 * straightening: 0 = free branching, 1 = one linear path with little sideways spreading. */
function generate(seed, count, angleDeg, straightening = 0.5) {
  const rng = mulberry32(seed);
  const S = Math.min(1, Math.max(0, straightening));
  const a = angleDeg * Math.PI / 180;
  const D = [Math.cos(a), -Math.sin(a)];                 // general direction on the (x,z) plane
  const along = (x, z) => x * D[0] + z * D[1];
  const side  = (x, z) => x * D[1] * -1 + z * D[0] * 1;  // signed sideways distance
  const band = BAND * lerp(1, 0.3, S);
  const backLimit = lerp(-120, 0, S);                    // straighter = nothing grows behind the start room                   // straighter map = narrower corridor of allowed drift
  const placed = [];
  const open = [];                                       // frontier connectors

  function add(type, k, px, pz, usedIdx, parent, opts = {}) {
    const def = opts.def || DEFS[type];
    const piece = { type, k, x: px, z: pz, scale: opts.scale || 1, rects: worldRects(def, k, px, pz), parent };
    Object.defineProperty(piece, 'fromConn', { value: opts.conn, enumerable: false });   // the frontier connector it was attached to (for backtracking)
    if (def.room) piece.room_type = opts.room_type || ROOM_TYPES[Math.floor(rng() * ROOM_TYPES.length)];
    if (opts.conn) opts.conn.used = true;                // the connector this piece was attached to is now taken
    const tips = [];
    def.conns.forEach(([cx, cz, dx, dz], i) => {
      const [rx, rz] = rot(cx, cz, k), [rdx, rdz] = rot(dx, dz, k);
      const tip = { piece, x: rx + px, z: rz + pz, dx: rdx, dz: rdz, fails: 0, used: i === usedIdx };
      tips.push(tip);
      if (i !== usedIdx) open.push(tip);
    });
    Object.defineProperty(piece, 'tips', { value: tips, enumerable: false });
    placed.push(piece);
    return piece;
  }
  const quarterTurn = (dx, dz, want) => { for (let k = 0; k < 4; k++) { const [rdx, rdz] = rot(dx, dz, k); if (rdx === -want[0] && rdz === -want[1]) return k; } return -1; };
  // nothing (except the fixed first hall, which is added directly) may come within START_CLEAR of the white start room
  const tooCloseToStart = rects => rects.some(r => placed[0].rects.some(s => rectDist(r, s) < START_CLEAR));
  const collides = (rects, parent) => tooCloseToStart(rects) || placed.some(p => p !== parent && p.rects.some(r1 => rects.some(r2 => overlap(r1, r2, MARGIN))));
  // how many halls are chained directly behind this piece (the piece itself included)
  const hallRun = piece => { let n = 0; for (let p = piece; p && p.type === 'hall'; p = p.parent) n++; return n; };

  // start: always a white room
  const startRoom = add('room', 0, 0, 0, -1, null, { room_type: 'white' });

  // the first piece attached to the white room is ALWAYS a hall pointing east; the room's other exits stay closed
  open.length = 0;
  {
    const [cx, cz, dx, dz] = DEFS.room.conns[0];            // the room's east opening
    const j = 0, k = quarterTurn(DEFS.hall.conns[j][2], DEFS.hall.conns[j][3], [dx, dz]);
    const [rx, rz] = rot(DEFS.hall.conns[j][0], DEFS.hall.conns[j][1], k);
    add('hall', k, cx + dx * GAP - rx, cz + dz * GAP - rz, j, startRoom, { conn: { fails: 0 } });
  }

  // straightening: a piece is a dead end if none of its exits points forward and every sideways exit
  // would run out of the allowed band within about one more corridor piece
  function deadEnd(def, k, px, pz, used) {
    return !def.conns.some(([cx, cz, dx, dz], i) => {
      if (i === used) return false;
      const [rx, rz] = rot(cx, cz, k), [rdx, rdz] = rot(dx, dz, k);
      if (rdx * D[0] + rdz * D[1] > 0.5) return true;
      const lat = side(px + rx, pz + rz), sw = rdx * D[1] * -1 + rdz * D[0];
      return Math.abs(lat + sw * 65) <= band;
    });
  }

  // grow the map by one piece (returns false if nothing could be placed this round)
  function step() {
    // choose a frontier connector: prefer ones far along the direction, pointing along it, and near the axis
    const maxA = Math.max(...open.map(c => along(c.x, c.z)));
    const tight = lerp(420, 90, S);                        // straighter = growth concentrates at the tip
    const weights = open.map(c => {
      const pro = Math.exp((along(c.x, c.z) - maxA) / tight);
      const dot = c.dx * D[0] + c.dz * D[1];
      const facing = 0.45 + 0.55 * Math.max(0, dot) + 0.25 * Math.abs(c.dx * D[1] - c.dz * D[0]) * 0.5;
      const lat = side(c.x, c.z);
      const sideward = (c.dx * D[1] * -1 + c.dz * D[0]);   // + = pointing further to the +side
      const drift = (Math.abs(lat) > band * 0.6 && sideward * lat > 0) ? 0.05 : 1;
      const aim = lerp(1, dot > 0 ? Math.max(0.03, dot * dot) : 0.02, S);   // straightening: openings that don't point forward are rarely used
      const center = lerp(1, Math.exp(-Math.abs(lat) / 150), S);              // straightening: pull toward the main axis
      return pro * facing * drift * aim * center * (c.fails ? 0.3 : 1) + 1e-6;
    });
    const ci = open.indexOf(pick(rng, open, weights));
    const c = open[ci];

    // candidate (type, own connector) combos in weighted random order
    const combos = [];
    for (const t of TYPES) {
      const def = DEFS[t];
      if (def.room && c.piece && DEFS[c.piece.type].room) continue;      // rooms never touch rooms
      if (t === 'hall' && hallRun(c.piece) >= MAX_HALL_RUN) continue;    // no more than 2 halls connected in a row
      def.conns.forEach(([, , dx, dz], j) => {
        const k = quarterTurn(dx, dz, [c.dx, c.dz]);
        if (k < 0) return;
        // straightening: favour pieces whose remaining exits keep heading forward, avoid bends and forks
        const exits = def.conns.filter((_, i) => i !== j).map(([, , ex, ez]) => { const [rdx, rdz] = rot(ex, ez, k); return rdx * D[0] + rdz * D[1]; });
        const forward = lerp(1, 0.1 + 0.9 * Math.max(0, Math.max(...exits)), S);
        const fork = exits.length >= 2 ? lerp(1, 0.25, S) : 1;
        combos.push({ t, j, k, w: def.weight * (def.room && rng() < 0.1 ? 0.3 : 1) * forward * fork });
      });
    }
    let success = false;
    while (combos.length && !success) {
      const idx = combos.indexOf(pick(rng, combos, combos.map(v => v.w)));
      const { t, j, k } = combos.splice(idx, 1)[0];
      const def = DEFS[t];
      const [cx, cz] = def.conns[j];
      const [rx, rz] = rot(cx, cz, k);
      const px = c.x + c.dx * GAP - rx, pz = c.z + c.dz * GAP - rz;
      if (Math.abs(side(px, pz)) > band || along(px, pz) < backLimit) continue;
      if (S >= 0.5 && deadEnd(def, k, px, pz, j)) continue;
      if (collides(worldRects(def, k, px, pz), c.piece)) continue;
      open.splice(ci, 1);
      add(t, k, px, pz, j, c.piece, { conn: c });
      success = true;
    }
    if (!success) { c.fails++; if (c.fails >= 2) open.splice(ci, 1); }
    return success;
  }

  function undoLast() {
    if (placed.length <= 2) return false;                  // keep the start room and its fixed east hall
    const p = placed.pop();
    for (let i = open.length - 1; i >= 0; i--) if (open[i].piece === p) open.splice(i, 1);
    p.fromConn.fails = 0; p.fromConn.used = false; open.push(p.fromConn);
    return true;
  }

  // end: a red room at 1.5x size, attached to the best open connector (far along the path, near the axis)
  function placeEnd(allowRoom = false) {
    const cands = open.map((c, i) => ({ c, i }))
      .filter(({ c }) => allowRoom || !DEFS[c.piece.type].room)           // rooms never touch rooms (unless nothing else is left)
      .sort((p, q) => (along(q.c.x, q.c.z) - lerp(0.2, 1, S) * Math.abs(side(q.c.x, q.c.z))) -
                      (along(p.c.x, p.c.z) - lerp(0.2, 1, S) * Math.abs(side(p.c.x, p.c.z))));
    for (const { c, i } of cands) {
      for (let j = 0; j < END_DEF.conns.length; j++) {

  const row = (hex, label) => { const d = document.createElement('div'); d.innerHTML = `<i style="background:${cssHex(hex)}"></i>${label}`; lg.appendChild(d); };
  row(pr.pieces.hall, 'Hall');
  for (const r of LEGEND_ORDER) row(pr.rooms[r], ROOM_LABELS[r]);
}
function applyPreset(key) {
  if (!PRESETS[key]) return;
  currentPreset = key;
  const pr = PRESETS[key];
  for (const t in materials) materials[t].color.copy(fitToLight(pr.pieces[t]));
  for (const r in roomMaterials) roomMaterials[r].color.copy(fitToLight(pr.rooms[r]));
  outlineMaterial.color.set(pr.outline); arrowOutlineMaterial.color.set(pr.outline);
  arrowMaterial.color.copy(fitToLight(pr.arrow)); arrowMaterial.emissive.copy(arrowMaterial.color).multiplyScalar(0.25);
  for (const type in iconMaterials) { iconMaterials[type].color.set(iconTint(type)); iconShadowMaterials[type].color.set(iconShadowTint()); }
  for (const el of [document.documentElement, document.body]) { el.style.setProperty('--bg-top', pr.bg[0]); el.style.setProperty('--bg-bottom', pr.bg[1]); }   // stage background   // icons may not be loaded yet: loadIcons() uses iconTint too
  updateBadgeColors();
  buildLegend();
  if (menuReady) refreshPresetButtons();
  try { localStorage.setItem(PRESET_KEY, key); } catch (_) {}
}
applyPreset(currentPreset);

/* ------------------------------------------------------------------ *
 *  Room icons: flat, unlit, always upright on screen, fading in with the top view (viewT)
 * ------------------------------------------------------------------ */
/* Real roof height of a room (local units): rays are shot straight down onto the room model, so rim / wall
 * tops that stick out above the roof don't make things float. Takes the highest hit under the footprint. */
let roofYCache = null;
function roofY() {
  if (roofYCache !== null) return roofYCache;
  geometries.room.computeBoundingBox();
  const bb = geometries.room.boundingBox;
  const mesh = new THREE.Mesh(geometries.room, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
  mesh.updateMatrixWorld(true);
  const rc = new THREE.Raycaster(), half = (bb.max.x - bb.min.x) * 0.26;
  let best = -Infinity;
  for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) {
    rc.set(new THREE.Vector3(i * half / 2, bb.max.y + 100, j * half / 2), new THREE.Vector3(0, -1, 0));
    const hit = rc.intersectObject(mesh)[0];                                   // nearest = topmost surface
    if (hit) best = Math.max(best, hit.point.y);
  }
  roofYCache = best > -Infinity ? best : bb.max.y;
  console.log('Room roof height:', roofYCache.toFixed(2), '(bounding box top:', bb.max.y.toFixed(2) + ')');
  return roofYCache;
}
const iconPlane = new THREE.PlaneGeometry(1, 1);
const badgeDisc = new THREE.CircleGeometry(0.5, 48);
function loadIcons() {
  const texLoader = new THREE.TextureLoader();
  for (const type in ICON_FILES) {
    const url = iconUrls[type] || ICON_DIR + ICON_FILES[type];
    const tex = texLoader.load(url, undefined, undefined, () => console.warn('Could not load icon ' + url));
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const base = { map: tex, transparent: true, depthWrite: false, toneMapped: false,
                   polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 };
    iconMaterials[type] = new THREE.MeshBasicMaterial({ ...base, color: iconTint(type) });   // unlit: pure tint colour (white unless the preset says otherwise)
    iconShadowMaterials[type] = new THREE.MeshBasicMaterial({ ...base, opacity: ICON_SHADOW, color: iconShadowTint() });
    const flat = { transparent: true, depthWrite: false, toneMapped: false, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 };
    badgeMaterials[type] = new THREE.MeshBasicMaterial(flat);
    badgeRingMaterials[type] = new THREE.MeshBasicMaterial(flat);
  }
  updateBadgeColors();
}
const iconRigs = [];       // one entry per icon on the map: { yaw, tilt, lift, size, k }
function placeIcon(r, e) {
  r.yaw.rotation.y = curAz - r.k * Math.PI / 2;            // face the camera's azimuth (minus the room's own rotation)
  r.tilt.rotation.x = -(Math.PI / 2 - curPolar);           // lean back by the camera's elevation: faces the camera exactly, lies flat from above
  // The icon always pivots around its BOTTOM edge, which never drops below the roof, so no part of it can sink into
  // the room while the view changes. To end up centred in the top view, that pivot slides toward the camera by half
  // the icon's height as it lies down (angled view: the bottom edge rests on the room centre, as before).
  r.tilt.position.z = r.half * e;
}
function makeIcon(room) {
  const mat = iconMaterials[room.room_type];
  if (!mat) return null;                                                    // white start room: no icon
  geometries.room.computeBoundingBox();
  const bb = geometries.room.boundingBox;
  const size = (bb.max.x - bb.min.x) * ICON_SIZE;                           // local units; the room's scale is inherited
  const holder = new THREE.Group();
  holder.position.set(0, roofY() + 1.5, 0);                                 // just above the roof (room for the drop shadow too)
  const yaw = new THREE.Group(), tilt = new THREE.Group(), lift = new THREE.Group();
  holder.add(yaw); yaw.add(tilt); tilt.add(lift);
  const D = size * BADGE_SIZE + size * BADGE_RING * 2 || size;               // overall height of icon + badge + outline
  lift.position.y = D / 2;                                                  // the badge's bottom edge is the pivot, so it never sinks into the roof
  const shadow = new THREE.Mesh(iconPlane, iconShadowMaterials[room.room_type]);
  shadow.scale.set(size, size, 1);
  shadow.position.set(size * 0.025, -size * 0.025, -0.3);                   // drop shadow: slightly right and down, just behind the icon
  shadow.renderOrder = 3;
  const icon = new THREE.Mesh(iconPlane, mat);
  icon.scale.set(size, size, 1);
  icon.renderOrder = 4;
  lift.add(shadow, icon);
  if (BADGE_SIZE > 0) {
    const ring = new THREE.Mesh(badgeDisc, badgeRingMaterials[room.room_type]);
    ring.scale.set(D, D, 1); ring.position.z = -0.9; ring.renderOrder = 1;
    const disc = new THREE.Mesh(badgeDisc, badgeMaterials[room.room_type]);
    disc.scale.set(D - size * BADGE_RING * 2, D - size * BADGE_RING * 2, 1); disc.position.z = -0.6; disc.renderOrder = 2;
    lift.add(ring, disc);
  }
  const rig = { yaw, tilt, lift, size, half: D / 2, k: room.k };
  iconRigs.push(rig); placeIcon(rig, smoothstep(viewT));
  return holder;
}
function updateIcons() {
  const e = smoothstep(viewT);                                              // 0 in the angled view -> 1 in the top view
  for (const r of iconRigs) placeIcon(r, e);
  for (const t in badgeMaterials) badgeMaterials[t].opacity = badgeRingMaterials[t].opacity = 1 - e;   // the badge melts away as the view turns to top-down
}

/* ------------------------------------------------------------------ *
 *  Build / rebuild the map
 * ------------------------------------------------------------------ */
let lastPieces = [];     // the structure currently shown (kept so it can be replayed exactly)

function makeMesh(p) {
  const m = new THREE.Mesh(geometries[p.type], p.room_type ? roomMaterials[p.room_type] : materials[p.type]);
  if (p.room_type) m.userData.room_type = p.room_type;
  m.position.set(p.x, 0, p.z);
  m.rotation.y = p.k * Math.PI / 2;
  m.scale.setScalar(p.scale || 1);
  m.castShadow = m.receiveShadow = true;
  const outline = new THREE.Mesh(outlineFor(p.type, p.scale || 1), outlineMaterial);   // child: follows the piece's position/rotation
  m.add(outline);
  if (p.room_type) { const icon = makeIcon(p); if (icon) m.add(icon); }
  if (arrowSpot && arrowSpot.piece === p) m.add(makeArrow(arrowSpot));   // location arrow (prototype)
  return m;
}
// allowed travel: the length of the map (plus a little margin), always including the start view
function fitBounds() {
  const box = new THREE.Box3().setFromObject(mapGroup);
  xMin = Math.min(box.min.x - 150, START_TARGET.x);
  xMax = Math.max(box.max.x + 150, START_TARGET.x);
  // top view: centre on the map's width and pull back far enough to fit all of it (the east-west extent scrolls)
  topZ = (box.min.z + box.max.z) / 2;
  const halfH = (box.max.z - box.min.z) / 2 + 120;
  topDist = Math.max(900, halfH / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}

function build() {
  const seed = 1;
  const count = 40;
  const angle = 0;   // the map always grows east
  const straight = 60 / 100;
  const pieces = generate(seed, count, angle, straight);
  lastPieces = pieces;
  arrowSpot = pickArrowSpot(pieces);                     // new random arrow spot for every generated map (a replay keeps it)
  anim = null;                                           // cancels a running animation
  mapGroup.clear(); iconRigs.length = 0;
  for (const p of pieces) mapGroup.add(makeMesh(p));
  fitBounds();
  resetView();
  console.log(`Generated ${pieces.length} pieces`, pieces.reduce((o, p) => (o[p.type] = (o[p.type] || 0) + 1, o), {}));
}

/* ------------------------------------------------------------------ *
 *  Build animation: wipe the map and rebuild the SAME structure piece by piece.
 *  Pieces closest to the origin come first; each one pops in slightly above its
 *  spot and drops smoothly into place while the camera follows the growing frontier.
 * ------------------------------------------------------------------ */
const ANIM = {
  fallHeight: 70,      // how far above its spot a piece appears
  fallTime: 0.8,       // seconds for one piece to land
  speed: 500,          // world units per second the build front travels east (total time = map length / speed)
  startDelay: 0.3,
  camSpeed: 3,         // camera follow smoothing (higher = camera hugs the front tighter; lag = speed / camSpeed)
};
// the view centre is a point below the ground; this is how far east of the ground point under the screen centre it sits
const FOCUS_OFF = (() => {
  const d = START_TARGET.clone().sub(START_POSITION);
  return START_TARGET.x - (START_POSITION.x + d.x * (START_POSITION.y / -d.y));
})();
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

function replay() {
  if (!lastPieces.length) return;
  mapGroup.clear(); iconRigs.length = 0;
  const items = lastPieces.map(p => { const m = makeMesh(p); mapGroup.add(m); return { p, m, key: Math.hypot(p.x, p.z), t0: 0 }; });
  fitBounds();                                           // same travel limits as the finished map
  // one clock drives everything: a "front" moves out from the origin at constant speed and each piece
  // drops when the front reaches its distance from the origin (so near pieces first, camera in sync)
  let kMax = 0;
  for (const it of items) { it.t0 = ANIM.startDelay + it.key / ANIM.speed; it.m.visible = false; kMax = Math.max(kMax, it.key); }
  dragging = false; vel = 0;
  resetView();
  anim = { t: 0, items, kMax };
}

function updateAnim(dt) {
  anim.t += dt;
  let done = true;
  for (const it of anim.items) {
    const u = (anim.t - it.t0) / ANIM.fallTime;
    if (u < 0) { done = false; continue; }
    it.m.visible = true;
    it.m.position.y = (1 - easeOutCubic(Math.min(1, u))) * ANIM.fallHeight;
    if (u < 1) done = false;
  }
  // camera: follows the front, which moves at constant speed, so the camera speed is constant too.
  // The exponential smoothing only softens the start (and the moment it leaves the starting view).
  const front = Math.min(anim.kMax, Math.max(0, anim.t - ANIM.startDelay) * ANIM.speed);
  const want = Math.max(START_TARGET.x, front + FOCUS_OFF);
  viewTarget.x += (want - viewTarget.x) * (1 - Math.exp(-ANIM.camSpeed * dt));
  applyView();
  if (done) {                                            // hand control back, carrying the camera's speed into the normal glide
    for (const it of anim.items) it.m.position.y = 0;
    vel = (want - viewTarget.x) * ANIM.camSpeed;
    anim = null;
  }
}

/* ------------------------------------------------------------------ *
 *  UI + loop
 * ------------------------------------------------------------------ */
const $ = id => document.getElementById(id);
/* Customize menu */
const customMenu = $('customMenu'), customBtn = $('customBtn');
const presetList = $('presetList');
for (const key in PRESETS) {
  const pr = PRESETS[key], b = document.createElement('button');
  b.className = 'preset'; b.dataset.key = key;
  const sw = [pr.pieces.hall, ...LEGEND_ORDER.map(r => pr.rooms[r])].map(h => `<i style="background:${cssHex(h)}"></i>`).join('');
  b.innerHTML = `<b>${pr.name}</b><div class="swatches">${sw}</div>`;
  b.onclick = e => { applyPreset(key); e.currentTarget.blur(); };
  presetList.appendChild(b);
}
function refreshPresetButtons() {
  for (const b of presetList.children) { const on = b.dataset.key === currentPreset; b.classList.toggle('active', on); b.setAttribute('aria-pressed', on); }
}
menuReady = true; refreshPresetButtons();
const arrowToggle = $('arrowToggle');
arrowToggle.checked = arrowEnabled;
arrowToggle.onchange = e => { setArrowEnabled(e.currentTarget.checked); e.currentTarget.blur(); };   // blur: keep the V / H / K hotkeys working
function setMenu(open) { customMenu.hidden = !open; customBtn.setAttribute('aria-expanded', open); }
customBtn.onclick = e => { setMenu(customMenu.hidden); e.currentTarget.blur(); };
$('menuClose').onclick = e => { setMenu(false); e.currentTarget.blur(); };
addEventListener('keydown', e => { if (e.key === 'Escape' && !customMenu.hidden) setMenu(false); });
const switchView = () => { if (handGoal) return; viewGoal = viewGoal ? 0 : 1; };
/* Hand type: toggles between the fixed background-only pose and the view we were in. While active, 'Switch view' is disabled. */
const handBtn = $('handBtn');
const HAND_FILES = { hand1: 'hand1.png', hand2: 'hand2.png', hand3: 'hand3.png', hand_contrast: 'hand_contrast.png' };
const HAND_LABELS = { hand1: 'Hand 1', hand2: 'Hand 2', hand3: 'Hand 3', hand_contrast: 'Hand (high contrast)' };
const handUrls = {};       // filled by the manual file picker when needed
let chosenHand = null;
const handPanel = $('handPanel');
function buildHandPanel() {
  const box = $('handChoices'); box.innerHTML = '';
  for (const key in HAND_FILES) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'handChoice'; b.dataset.hand = key;
    b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', 'false');
    b.setAttribute('aria-label', HAND_LABELS[key]); b.title = HAND_LABELS[key];
    const img = document.createElement('img'); img.alt = ''; img.draggable = false;
    img.src = handUrls[key] || ICON_DIR + HAND_FILES[key];
    img.onerror = () => console.warn('Could not load hand image ' + img.src);
    b.append(img);
    b.onclick = e => { chooseHand(key); e.currentTarget.blur(); };
    box.append(b);
  }
}
function chooseHand(key) {   // only one hand can be chosen at a time
  chosenHand = key;
  for (const b of document.querySelectorAll('.handChoice')) b.setAttribute('aria-checked', b.dataset.hand === key);
}
function updateHandPanel() {   // visible only once the camera has finished turning into the hand pose
  const show = handGoal === 1 && handT >= 1;
  if (handPanel.classList.contains('show') !== show) { handPanel.classList.toggle('show', show); handPanel.setAttribute('aria-hidden', !show); }
}
function toggleHand() {
  handGoal = handGoal ? 0 : 1;
  if (handGoal) { vel = 0; goTo = null; }
  handBtn.setAttribute('aria-pressed', !!handGoal);
  $('viewBtn').disabled = !!handGoal;
}
handBtn.onclick = e => { toggleHand(); e.currentTarget.blur(); };
/* Go to arrow: the camera only ever slides east-west, so find the x that puts the arrow in the middle of the screen
 * (for the view we are in or heading to) and glide there. */
function arrowViewX() {
  if (!arrowBob) return null;
  mapGroup.updateMatrixWorld(true);
  const p = arrowBob.obj.getWorldPosition(new THREE.Vector3());
  const x0 = viewTarget.x, t0 = viewT;
  viewT = viewGoal;                                        // solve for the view we will be in
  const ndcX = x => { viewTarget.x = x; applyView(); camera.updateMatrixWorld(true); return p.clone().project(camera).x; };
  let x = x0;
  for (let i = 0; i < 10; i++) {                           // secant iterations: screen-x is almost linear in the camera's x
    const f = ndcX(x);
    if (Math.abs(f) < 1e-4) break;
    const slope = (ndcX(x + 10) - f) / 10;
    if (!slope) break;
    x -= f / slope;
  }
  x = Math.min(xMax, Math.max(xMin, x));
  viewT = t0; viewTarget.x = x0; applyView();
  return x;
}
function goToArrow() {
  if (anim || handGoal) return;
  if (!arrowBob || !arrowEnabled) { toast(arrowBob ? 'The arrow is hidden (Customize menu)' : 'There is no arrow on this map'); return; }
  const x = arrowViewX();
  if (x === null) return;
  vel = 0; goTo = x;
}
$('arrowBtn').onclick = e => { goToArrow(); e.currentTarget.blur(); };
addEventListener('keydown', e => {
  if (e.key.toLowerCase() !== 'g' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
  goToArrow();
});
$('viewBtn').onclick = e => { switchView(); e.currentTarget.blur(); };
addEventListener('keydown', e => {
  if (e.key.toLowerCase() !== 'v' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
  switchView();
});
/* H: show / hide all UI */
addEventListener('keydown', e => {
  if (e.key.toLowerCase() !== 'h' || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
  document.body.classList.toggle('ui-hidden');
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
});
/* K: copy the current view angle to the clipboard */
let toastTimer;
function toast(text) { const el = $('toast'); el.textContent = text; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1800); }
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); return ok;
  }
}
addEventListener('keydown', async e => {
  if (e.key.toLowerCase() !== 'k' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
  const deg = r => +(r * 180 / Math.PI).toFixed(2), r2 = v => +v.toFixed(2);
  const off = camera.position.clone().sub(focus), polar = Math.acos(off.y / off.length());
  const view = {
    azimuth: deg(Math.atan2(off.x, off.z)),        // rotation around the vertical axis (0 = looking from +Z)
    polar: deg(polar),                                 // angle from straight above (0 = top-down, 90 = horizon)
    elevation: deg(Math.PI / 2 - polar),               // angle above the ground
    distance: r2(off.length()),
    position: camera.position.toArray().map(r2),
    target: focus.toArray().map(r2),
  };
  const ok = await copyText(JSON.stringify(view));
  toast(ok ? `Copied: azimuth ${view.azimuth}°, elevation ${view.elevation}°` : 'Could not access the clipboard');
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

async function start() {
  try {
    try {
      await fetchModels();
    } catch (e) {
      // Browsers block fetch() on file:// pages, so offer a manual file picker as a fallback.
      console.warn(e);
      await pickModels(e);
    }
    loadModels(); loadIcons(); buildHandPanel(); build(); $('msg').remove();
  } catch (e) { $('msg').textContent = 'Could not load models: ' + e.message; console.error(e); }
}
// Fallback: let the user select the .fbx files by hand (works when opened directly from disk).
function pickModels(cause) {
  return new Promise((resolve, reject) => {
    const msg = $('msg');
    msg.style.pointerEvents = 'auto';
    msg.innerHTML = '';
    const box = document.createElement('div');
    box.style.cssText = 'max-width:420px;padding:16px;border-radius:8px;background:rgba(14,26,48,.85);text-align:center;line-height:1.5';
    box.innerHTML = '<div>Could not fetch the models automatically<br><small style="opacity:.7">(' + cause.message + ')</small></div>' +
      '<div style="margin:8px 0">Select all needed files: <b>' + TYPES.map(t => t + '.fbx').join(', ') + '</b><br><small style="opacity:.7">(and the icons: ' + Object.values(ICON_FILES).concat(Object.values(HAND_FILES)).join(', ') + ')</small></div>';
    const input = document.createElement('input');
    input.type = 'file'; input.accept = '.fbx,.png'; input.multiple = true;
    input.onchange = async () => {
      try {
        for (const f of input.files) {
          const iconType = Object.keys(ICON_FILES).find(k => ICON_FILES[k] === f.name.toLowerCase());
          if (iconType) { iconUrls[iconType] = URL.createObjectURL(f); continue; }   // icon picked by hand
          const handKey = Object.keys(HAND_FILES).find(k => HAND_FILES[k] === f.name.toLowerCase());
          if (handKey) { handUrls[handKey] = URL.createObjectURL(f); continue; }      // hand image picked by hand
          const t = f.name.replace(/\.fbx$/i, '').toLowerCase();
          if (TYPES.includes(t)) modelBuffers[t] = await f.arrayBuffer();
        }
        const missing = TYPES.filter(t => !modelBuffers[t]);
        if (missing.length) { note.textContent = 'Still missing: ' + missing.map(t => t + '.fbx').join(', '); return; }
        msg.style.pointerEvents = 'none'; msg.textContent = 'Loading models…';
        resolve();
      } catch (e) { reject(e); }
    };
    const note = document.createElement('div'); note.style.cssText = 'margin-top:8px;color:#ffb4a8';
    box.append(input, note); msg.append(box);
  });
}
start();

let lastT = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (anim) updateAnim(dt);                          // build animation drives the pieces AND the camera
  if (viewT !== viewGoal) {                          // glide between the angled and the top-down view
    const step = dt / VIEW_TIME;
    viewT = viewGoal > viewT ? Math.min(viewGoal, viewT + step) : Math.max(viewGoal, viewT - step);
    applyView();
  }
  if (handT !== handGoal) {                          // glide into / out of the hand pose
    const step = dt / HAND_TIME;
    handT = handGoal > handT ? Math.min(handGoal, handT + step) : Math.max(handGoal, handT - step);
    applyView();
  }
  updateIcons();
  updateHandPanel();
  if (arrowBob && ARROW_BOB) arrowBob.obj.position.y = arrowBob.baseY + Math.sin(now / 450) * ARROW_BOB / arrowBob.s;   // gentle floating
  const dir = (anim || handGoal) ? 0 : (held.has('arrowright') || held.has('d') ? 1 : 0) - (held.has('arrowleft') || held.has('a') ? 1 : 0);
  if (dir) { vel = dir * 700; goTo = null; }         // keys: constant speed while held
  if (goTo !== null && !anim && !dragging && !handGoal) {         // 'Go to arrow': ease toward the target x
    const d = goTo - viewTarget.x;
    if (Math.abs(d) < 0.5) { viewTarget.x = goTo; goTo = null; }
    else viewTarget.x += d * (1 - Math.exp(-5 * dt));
    vel = 0; applyView();
  }
  if (!dragging && !anim && !handGoal) {
    if (vel) moveX(vel * dt);
    if (!dir) vel *= Math.exp(-FRICTION * dt);       // frame-rate-independent decay
    if (Math.abs(vel) < 1 || viewTarget.x <= xMin || viewTarget.x >= xMax) vel = 0;
  }
  renderer.render(scene, camera);
});
</script>
